<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffelia – Gestion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF;--ink:#2E1B14;--muted:#7B6458;--line:#E3D3C6;--accent:#8C6A3F;--rose:#D8B9A7;--rose-soft:#F1E2D6;
  --dark:#2A1812;--dark-ink:#F6EBDD;--gold:#D9BC8C;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E130E;--ink:#F3E6D8;--muted:#BFA796;--line:#3A2820;--accent:#D9BC8C;--rose-soft:#2D1D16;--dark:#140C09}}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:1.0625rem;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
img,svg{max-width:100%}

header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.4rem 0}
.brand{font-family:var(--serif);font-size:1.6rem;font-weight:500;letter-spacing:.34em;text-decoration:none;padding-left:.34em}
nav{display:flex;gap:2rem;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase}
nav a{text-decoration:none;padding:.3rem 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav a:hover{border-color:var(--accent)}

.eyebrow{font-size:.74rem;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin:0 0 1.25rem;font-weight:400}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
h1{font-size:clamp(3rem,7.6vw,6.2rem);line-height:.98;letter-spacing:-.015em;margin-bottom:1.75rem}
h1 em,.band em{font-style:italic;font-weight:400}
h2{font-size:clamp(2.3rem,5vw,3.8rem);line-height:1.05;margin-bottom:1rem}
.intro{max-width:46ch;color:var(--muted);margin:0 0 2.5rem}
.note{color:var(--muted);font-size:.95rem}

.btn{display:inline-block;padding:1rem 2rem;border:1px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;font-family:var(--sans);font-size:.74rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:.8rem 1.4rem;font-size:.7rem}
.actions{display:flex;flex-wrap:wrap;gap:1rem}

.hero{background:var(--dark);color:var(--dark-ink);padding:clamp(3rem,8vw,6.5rem) 0 0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(2rem,6vw,5rem);align-items:end}
.hero .eyebrow,.hero h1 em{color:var(--gold)}
.hero .lead{max-width:36ch;font-size:1.15rem;color:rgba(246,235,221,.78);margin:0 0 2.5rem}
.hero .btn{border-color:rgba(246,235,221,.55);color:var(--dark-ink)}
.hero .btn.primary{background:var(--dark-ink);color:var(--dark);border-color:var(--dark-ink)}
.hero .btn:hover{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.hero-text{padding-bottom:clamp(3rem,8vw,6.5rem)}
.arch{background:#FCF5ED;border-radius:999px 999px 0 0;padding:22% 9% 0;max-width:440px;width:100%;margin-inline:auto}
.arch img{display:block;width:100%;height:auto}

.manifesto{padding:clamp(4rem,10vw,8rem) 0;text-align:center}
.manifesto .big{font-family:var(--serif);font-style:italic;font-size:clamp(1.9rem,4.4vw,3.2rem);line-height:1.2;max-width:22ch;margin:0 auto 1.5rem}
.manifesto .sub{max-width:44ch;margin:0 auto;color:var(--muted)}
.manifesto .rule{display:block;width:1px;height:3.5rem;background:var(--accent);margin:0 auto 2rem}

.features{padding-bottom:clamp(3rem,8vw,6rem)}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,6rem);align-items:center;padding:clamp(2rem,5vw,3.5rem) 0;border-top:1px solid var(--line)}
.feature:nth-of-type(even) .art{order:2}
.art{background:var(--rose-soft);border-radius:999px 999px 0 0;padding:22% 14% 8%;max-width:380px;width:100%;margin-inline:auto;color:var(--ink)}
.art svg{width:100%;height:auto;display:block}
.num{font-size:.74rem;letter-spacing:.3em;color:var(--accent);margin:0 0 1rem}
.feature h3{font-size:clamp(2rem,4vw,3rem);margin-bottom:.75rem}
.feature p{color:var(--muted);max-width:36ch;margin:0 0 1.75rem}
.link{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:.25rem}

.band{background:var(--dark);color:var(--dark-ink);text-align:center;padding:clamp(4rem,10vw,8rem) 0}
.band .eyebrow{color:var(--gold)}
.band p.sig{font-family:var(--serif);font-size:clamp(2.2rem,6.5vw,5rem);line-height:1.08;margin:0 auto;max-width:15ch}

.contact{text-align:center;padding:clamp(4rem,9vw,7rem) 0}
.contact h2{max-width:16ch;margin-inline:auto}
.contact p{color:var(--muted);max-width:40ch;margin:0 auto 2rem}

section.page{padding:clamp(2.5rem,6vw,4.5rem) 0 clamp(3rem,8vw,6rem)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:3rem 1.75rem}
.product{display:flex;flex-direction:column;align-items:center;text-align:center}
.product img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 0 0;background:var(--rose-soft);display:block;transition:transform .7s}
.product:hover img{transform:scale(1.02)}
.product h3{font-size:1.6rem;line-height:1.2;margin:1.25rem 0 .2rem}
.product .price{margin:0 0 1rem;color:var(--accent);letter-spacing:.14em;font-size:.9rem}
.back{display:inline-block;margin-bottom:2rem;color:var(--muted);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase}

.checkout{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:center}
.checkout img{width:100%;max-width:460px;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 0 0;background:var(--rose-soft);display:block;margin-inline:auto}
.checkout h2{margin-bottom:.25rem}
.checkout .big{font-family:var(--serif);font-size:1.8rem;color:var(--accent);margin:0 0 2rem}
.checkout h3,.panel h3{font-size:1.5rem;margin:0 0 .75rem}
.checkout ol{padding-left:1.2rem;margin:0 0 1.75rem;color:var(--muted)}
.checkout label,.panel label{display:grid;gap:.4rem;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:1.1rem}
.checkout input,.panel input{font:inherit;font-size:1rem;letter-spacing:0;text-transform:none;padding:.8rem .9rem;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);width:100%}
.panel{border:1px solid var(--line);padding:1.5rem;margin-bottom:1.5rem;max-width:520px}
.panel form{display:grid;gap:.25rem}
.panel button:disabled{opacity:.6;cursor:wait}
#status{min-height:1.6em}
.row{display:flex;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;object-fit:cover}
.row span{flex:1}
.row button{background:none;border:1px solid var(--line);color:var(--muted);padding:.35rem .9rem;font:inherit;font-size:.78rem;cursor:pointer}

footer{background:var(--dark);color:var(--dark-ink);padding:3rem 0 2.5rem;font-size:.9rem}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
footer .brand{font-size:1.2rem}
footer a{text-decoration:none;letter-spacing:.14em}

@media (max-width:820px){
  .hero .wrap,.feature,.checkout{grid-template-columns:1fr}
  .hero .arch{order:-1;max-width:320px}
  .hero-text{padding-bottom:3rem}
  .feature:nth-of-type(even) .art{order:0}
  .art{max-width:300px}
  nav{gap:1.1rem;font-size:.68rem;letter-spacing:.16em}
  .brand{font-size:1.2rem;letter-spacing:.26em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="index.html">COFFELIA</a><nav><a href="index.html#catalogue">Voir le catalogue</a><a id="logout" href="#" hidden>Se déconnecter</a></nav></div></header>
<main><section class="page"><div class="wrap">
  <h2>Gestion du catalogue</h2>
  <p id="status" role="status" class="intro"></p>
  <div id="loginBox" class="panel" hidden>
    <h3>Connexion administrateur</h3>
    <form id="loginForm">
      <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="lPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </div>
  <div id="adminPanel" hidden>
    <div class="panel"><h3>Ajouter un article</h3>
      <form id="addForm">
        <label>Nom<input id="fName" type="text" maxlength="60" required></label>
        <label>Prix (en DH)<input id="fPrice" type="number" min="0" step="any" inputmode="decimal" required></label>
        <label>Photo<input id="fPhoto" type="file" accept="image/*" required></label>
        <button class="btn primary" id="fBtn" type="submit">Ajouter au catalogue</button>
      </form></div>
    <div class="panel"><h3>Contact WhatsApp pour le paiement</h3>
      <form id="waForm">
        <label>Numéro WhatsApp (avec l’indicatif, ou 06… pour le Maroc)<input id="fWa" type="tel" inputmode="tel" autocomplete="off"></label>
        <button class="btn primary" type="submit">Enregistrer le numéro</button>
      </form></div>
    <h3 style="font-family:var(--serif);font-weight:500;font-size:1.5rem">Articles du catalogue</h3>
    <div id="adminList"></div>
  </div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg=window.COFFELIA_CONFIG,sb=supabase.createClient(cfg.url,cfg.anonKey);
  var $=function(id){return document.getElementById(id)},fmt=new Intl.NumberFormat("fr-FR");
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function say(m){$("status").textContent=m}
  function cleanWa(n){var s=String(n||"").replace(/\D/g,"");if(s.indexOf("00")===0)s=s.slice(2);else if(s.charAt(0)==="0")s="212"+s.slice(1);return s.length>=8?s:""}
  function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("image"))},"image/jpeg",.85)};img.onerror=function(){rej(new Error("image"))};img.src=u})}
  function showLogin(){$("loginBox").hidden=false;$("adminPanel").hidden=true;$("logout").hidden=true}
  async function check(){
    var s=(await sb.auth.getSession()).data.session;
    if(!s){showLogin();return}
    var r=await sb.rpc("is_admin");
    if(r.error||!r.data){await sb.auth.signOut();showLogin();say("Ce compte n’a pas accès à la gestion.");return}
    $("loginBox").hidden=true;$("adminPanel").hidden=false;$("logout").hidden=false;say("");await refresh();
  }
  async function refresh(){
    var p=await sb.from("products").select("*").order("created_at",{ascending:false});
    var w=await sb.from("settings").select("value").eq("key","whatsapp").maybeSingle();
    $("fWa").value=(w.data&&w.data.value)||"";
    var l=$("adminList");l.textContent="";
    var items=p.data||[];
    if(!items.length)l.append(el("p","note","Aucun article pour le moment."));
    items.forEach(function(it){
      var r=el("div","row"),img=el("img");img.src=it.image_url;img.alt="";
      var b=el("button",null,"Supprimer");b.type="button";
      b.addEventListener("click",async function(){
        if(b.dataset.ask!=="1"){b.dataset.ask="1";b.textContent="Confirmer";return}
        var d=await sb.from("products").delete().eq("id",it.id);
        if(d.error){say("La suppression a échoué.");return}
        await sb.storage.from("products").remove([it.image_url.split("/").pop()]);
        refresh();
      });
      r.append(img,el("span",null,it.name+" – "+fmt.format(it.price)+" DH"),b);l.append(r);
    });
  }
  $("loginForm").addEventListener("submit",async function(e){
    e.preventDefault();say("Connexion…");
    var r=await sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});
    if(r.error){say("E-mail ou mot de passe incorrect.");return}
    $("lPass").value="";check();
  });
  $("logout").addEventListener("click",async function(e){e.preventDefault();await sb.auth.signOut();say("");showLogin()});
  $("addForm").addEventListener("submit",async function(e){
    e.preventDefault();var btn=$("fBtn");btn.disabled=true;say("Ajout en cours…");
    try{
      var blob=await shrink($("fPhoto").files[0]),path=crypto.randomUUID()+".jpg";
      var u=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});
      if(u.error)throw u.error;
      var url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
      var i=await sb.from("products").insert({name:$("fName").value.trim(),price:Number($("fPrice").value),image_url:url});
      if(i.error)throw i.error;
      $("addForm").reset();say("Article ajouté.");await refresh();
    }catch(err){say("L’ajout a échoué. Vérifiez la photo et votre connexion.")}
    btn.disabled=false;
  });
  $("waForm").addEventListener("submit",async function(e){
    e.preventDefault();var raw=$("fWa").value.trim(),n=cleanWa(raw);
    if(raw&&!n){say("Numéro invalide. Vérifiez l’indicatif et les chiffres.");return}
    var r=await sb.from("settings").upsert({key:"whatsapp",value:n});
    say(r.error?"L’enregistrement a échoué.":"Numéro enregistré.");
  });
  check();
})();
</script>
</body>
</html>
