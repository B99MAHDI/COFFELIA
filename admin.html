<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffelia – Gestion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Concept : bandes de couleurs pastel, gros titres ronds, autocollants et mugs qui bougent. Une seule audace : le titre géant avec son surlignage. */
:root{
  --display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#FFF8F0; --ink:#2B1710; --muted:#6F574A; --line:#EAD9C8;
  --blush:#F6CFC3; --pistache:#D5E5B8; --latte:#EBD3B6; --lilac:#DDD2F2;
  --card-ink:#2B1710; --btn:#2B1710; --btn-ink:#FFF8F0; --band:#2B1710; --band-ink:#FFF3E4; --glass:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C110C;--ink:#FBEBDD;--muted:#C4A997;--line:#3A271E;
  --blush:#5E3C35;--pistache:#40492F;--latte:#58422F;--lilac:#483B63;
  --card-ink:#FBEBDD;--btn:#FBEBDD;--btn-ink:#1C110C;--band:#120A07;--band-ink:#FFF3E4;--glass:#2A1B14;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C110C;--ink:#FBEBDD;--muted:#C4A997;--line:#3A271E;
  --blush:#5E3C35;--pistache:#40492F;--latte:#58422F;--lilac:#483B63;
  --card-ink:#FBEBDD;--btn:#FBEBDD;--btn-ink:#1C110C;--band:#120A07;--band-ink:#FFF3E4;--glass:#2A1B14;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}
.wrap{width:min(1200px,100%);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1;letter-spacing:-.02em;text-wrap:balance}

.top{padding-block:1.1rem}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.03em;text-decoration:none}
.pills{display:flex;gap:.4rem;flex-wrap:wrap}
.pills a{text-decoration:none;font-weight:500;font-size:.95rem;padding:.55rem 1.05rem;border-radius:999px;border:2px solid var(--ink)}
.pills a:hover{background:var(--ink);color:var(--bg)}

.hero{padding-block:clamp(1.5rem,4vw,3.5rem) clamp(2.5rem,6vw,5rem)}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}
.hero>.wrap>*{min-width:0}
.tag{display:inline-block;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:.45rem .9rem;border-radius:999px;background:var(--pistache);color:var(--card-ink);margin-bottom:1.25rem}
h1{font-weight:800;font-size:clamp(3rem,8.2vw,7rem)}
h1 mark{background:var(--blush);color:inherit;padding:0 .18em;border-radius:.25em;display:inline-block;transform:rotate(-2deg)}
.lead{max-width:34ch;font-size:1.2rem;color:var(--muted);margin:1.5rem 0 2rem}
.row{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 1rem var(--body);padding:.95rem 1.7rem;border-radius:999px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);text-decoration:none;cursor:pointer;transition:transform .2s}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}

.stage{position:relative;aspect-ratio:1/1;max-width:100%;width:min(520px,100%);margin-inline:auto}
.blob{position:absolute;inset:6% 4% 2% 8%;background:var(--blush);border-radius:58% 42% 55% 45%/48% 56% 44% 52%}
.logo-card{position:absolute;inset:16% 18% 14% 18%;background:#FCF5ED;border-radius:28px;padding:5%;transform:rotate(4deg);box-shadow:0 18px 0 -6px rgba(43,23,16,.12)}
.logo-card img{display:block;width:100%;height:100%;object-fit:contain}
.float{position:absolute;width:30%;animation:bob 5s ease-in-out infinite}
.float.a{left:-2%;top:6%;animation-delay:-1.5s}
.float.b{right:-2%;bottom:2%;animation-delay:-3s}
.stamp{position:absolute;right:2%;top:2%;width:28%;animation:spin 22s linear infinite}
.stamp text{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;fill:var(--ink)}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

.ticker{background:var(--band);color:var(--band-ink);overflow:hidden;padding:1rem 0;transform:rotate(-1.2deg);margin-inline:-2%}
.ticker div{display:flex;width:max-content;gap:2.2rem;animation:slide 26s linear infinite}
.ticker span{font-family:var(--display);font-weight:700;font-size:1.5rem;white-space:nowrap;display:flex;align-items:center;gap:2.2rem}
.ticker span::after{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--blush)}
@keyframes slide{to{transform:translateX(-50%)}}

.shop{padding-block:clamp(3.5rem,8vw,6.5rem)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.25rem;margin-bottom:2.25rem}
h2{font-weight:800;font-size:clamp(2.2rem,5.4vw,4rem)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{font:500 .95rem var(--body);padding:.55rem 1.1rem;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{color:var(--muted);font-size:.95rem;margin:0 0 1.5rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.25rem}
.card{border-radius:32px;padding:1.4rem;color:var(--card-ink);display:flex;flex-direction:column;gap:.9rem;min-width:0;transition:transform .25s}
.card:hover{transform:translateY(-6px) rotate(-.8deg)}
.card.blush{background:var(--blush)}.card.pistache{background:var(--pistache)}.card.latte{background:var(--latte)}.card.lilac{background:var(--lilac)}
.art{aspect-ratio:1/.82;display:grid;place-items:center}
.art svg{width:62%;height:auto;transition:transform .35s}
.card:hover .art svg{transform:rotate(-6deg) scale(1.06)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.card h3{font-size:1.55rem}
.price{font-weight:700;background:var(--bg);color:var(--ink);padding:.3rem .8rem;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kind{font-size:.85rem;opacity:.75;margin:0}
.card .btn{width:100%}

.band{background:var(--lilac);color:var(--card-ink);padding-block:clamp(3rem,7vw,5.5rem)}
.band .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.band .wrap>*{min-width:0}
.step b{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:1.2rem;margin-bottom:.9rem}
.step h3{font-size:1.5rem;margin-bottom:.4rem}
.step p{margin:0;max-width:30ch}
.band h2{grid-column:1/-1}

footer{background:var(--band);color:var(--band-ink);padding-block:2.5rem}
footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
footer .brand{font-size:1.4rem}
footer a{text-underline-offset:4px}


@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr}
  .stage{order:-1;width:min(380px,100%)}
  .band .wrap{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr}
  .sheet .pic svg{width:40%}
  .pills a:first-child{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.page{padding-block:clamp(2rem,5vw,4rem) clamp(3rem,8vw,6rem)}
.page h2{margin-bottom:1rem}
.intro{color:var(--muted);max-width:46ch;margin:0 0 2rem}
.back{display:inline-block;margin-bottom:1.75rem;font-weight:500;color:var(--muted)}
.photo{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:22px;background:var(--bg)}
.card:hover .photo{transform:scale(1.02)}
.photo{transition:transform .35s}
.checkout{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:center}
.checkout>*{min-width:0}
.checkout .photo{max-width:460px;margin-inline:auto;border-radius:36px}
.checkout h2{font-size:clamp(2.2rem,5vw,3.6rem)}
.checkout .big{font-family:var(--display);font-weight:700;font-size:1.8rem;margin:0 0 1.75rem}
.checkout h3,.panel h3{font-size:1.5rem;margin:0 0 .75rem}
.checkout ol{padding-left:1.2rem;margin:0 0 1.5rem;color:var(--muted)}
.checkout label,.panel label{display:grid;gap:.35rem;font-weight:500;font-size:.92rem;margin-bottom:1rem}
.checkout input,.panel input{font:inherit;padding:.8rem .95rem;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.panel{background:var(--latte);color:var(--card-ink);border-radius:28px;padding:1.5rem;margin-bottom:1.5rem;max-width:520px}
.panel input{background:var(--bg);color:var(--ink)}
.panel form{display:grid;gap:.25rem}
.panel .btn{justify-self:start}
.panel button:disabled{opacity:.6;cursor:wait}
#status{min-height:1.6em}
.arow{display:flex;align-items:center;gap:1rem;padding:.8rem 0;border-bottom:2px solid var(--line)}
.arow img{width:56px;height:56px;object-fit:cover;border-radius:14px}
.arow span{flex:1;min-width:0}
.arow button{background:none;border:2px solid var(--line);color:var(--muted);border-radius:999px;padding:.35rem .95rem;font:500 .85rem var(--body);cursor:pointer}
.adm h3.lst{font-size:1.5rem;margin:2rem 0 .5rem}
@media (max-width:820px){.checkout{grid-template-columns:1fr}}
.panel select{font:inherit;padding:.8rem .95rem;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="index.html">Coffelia</a><nav class="pills"><a href="index.html#catalogue">Voir le catalogue</a><a id="logout" href="#" hidden>Se déconnecter</a></nav></div></header>
<main><section class="page adm"><div class="wrap">
  <h2>Gestion</h2>
  <p id="status" role="status" class="intro"></p>
  <div id="loginBox" class="panel" hidden>
    <h3>Connexion administrateur</h3>
    <form id="loginForm">
      <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="lPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </div>
  <div id="adminPanel" hidden>
    <div class="panel"><h3>Ajouter un article</h3>
      <form id="addForm">
        <label>Nom<input id="fName" type="text" maxlength="60" required></label>
        <label>Prix (en DH)<input id="fPrice" type="number" min="0" step="any" inputmode="decimal" required></label>
        <label>Type<select id="fType"><option value="mug">Mug</option><option value="verre">Verre à café</option></select></label>
        <label>Photo<input id="fPhoto" type="file" accept="image/*" required></label>
        <button class="btn primary" id="fBtn" type="submit">Ajouter au catalogue</button>
      </form></div>
    <div class="panel"><h3>Contact WhatsApp pour le paiement</h3>
      <form id="waForm">
        <label>Numéro WhatsApp (avec l’indicatif, ou 06… pour le Maroc)<input id="fWa" type="tel" inputmode="tel" autocomplete="off"></label>
        <button class="btn primary" type="submit">Enregistrer le numéro</button>
      </form></div>
    <h3 class="lst">Articles du catalogue</h3>
    <div id="adminList"></div>
  </div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg=window.COFFELIA_CONFIG,sb=supabase.createClient(cfg.url,cfg.anonKey);
  var $=function(id){return document.getElementById(id)},fmt=new Intl.NumberFormat("fr-FR");
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function say(m){$("status").textContent=m}
  function cleanWa(n){var s=String(n||"").replace(/\D/g,"");if(s.indexOf("00")===0)s=s.slice(2);else if(s.charAt(0)==="0")s="212"+s.slice(1);return s.length>=8?s:""}
  function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("image"))},"image/jpeg",.85)};img.onerror=function(){rej(new Error("image"))};img.src=u})}
  function showLogin(){$("loginBox").hidden=false;$("adminPanel").hidden=true;$("logout").hidden=true}
  async function check(){
    var s=(await sb.auth.getSession()).data.session;
    if(!s){showLogin();return}
    var r=await sb.rpc("is_admin");
    if(r.error||!r.data){await sb.auth.signOut();showLogin();say("Ce compte n’a pas accès à la gestion.");return}
    $("loginBox").hidden=true;$("adminPanel").hidden=false;$("logout").hidden=false;say("");await refresh();
  }
  async function refresh(){
    var p=await sb.from("products").select("*").order("created_at",{ascending:false});
    var w=await sb.from("settings").select("value").eq("key","whatsapp").maybeSingle();
    $("fWa").value=(w.data&&w.data.value)||"";
    var l=$("adminList");l.textContent="";
    var items=p.data||[];
    if(!items.length)l.append(el("p","note","Aucun article pour le moment."));
    items.forEach(function(it){
      var r=el("div","arow"),img=el("img");img.src=it.image_url;img.alt="";
      var b=el("button",null,"Supprimer");b.type="button";
      b.addEventListener("click",async function(){
        if(b.dataset.ask!=="1"){b.dataset.ask="1";b.textContent="Confirmer";return}
        var d=await sb.from("products").delete().eq("id",it.id);
        if(d.error){say("La suppression a échoué.");return}
        await sb.storage.from("products").remove([it.image_url.split("/").pop()]);
        refresh();
      });
      r.append(img,el("span",null,it.name+" ("+(it.type==="verre"?"verre":"mug")+") – "+fmt.format(it.price)+" DH"),b);l.append(r);
    });
  }
  $("loginForm").addEventListener("submit",async function(e){
    e.preventDefault();say("Connexion…");
    var r=await sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});
    if(r.error){say("E-mail ou mot de passe incorrect.");return}
    $("lPass").value="";check();
  });
  $("logout").addEventListener("click",async function(e){e.preventDefault();await sb.auth.signOut();say("");showLogin()});
  $("addForm").addEventListener("submit",async function(e){
    e.preventDefault();var btn=$("fBtn");btn.disabled=true;say("Ajout en cours…");
    try{
      var blob=await shrink($("fPhoto").files[0]),path=crypto.randomUUID()+".jpg";
      var u=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});
      if(u.error)throw u.error;
      var url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
      var i=await sb.from("products").insert({name:$("fName").value.trim(),price:Number($("fPrice").value),type:$("fType").value,image_url:url});
      if(i.error)throw i.error;
      $("addForm").reset();say("Article ajouté.");await refresh();
    }catch(err){say("L’ajout a échoué. Vérifiez la photo et votre connexion.")}
    btn.disabled=false;
  });
  $("waForm").addEventListener("submit",async function(e){
    e.preventDefault();var raw=$("fWa").value.trim(),n=cleanWa(raw);
    if(raw&&!n){say("Numéro invalide. Vérifiez l’indicatif et les chiffres.");return}
    var r=await sb.from("settings").upsert({key:"whatsapp",value:n});
    say(r.error?"L’enregistrement a échoué.":"Numéro enregistré.");
  });
  check().catch(function(){showLogin();say("Connexion à la base impossible. Vérifiez config.js et votre connexion.")});
})();
</script>
</body>
</html>
