<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffelia – Gestion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF5ED; --ink:#4A2C20; --muted:#7A5C4E; --rose:#D8B9A7; --rose-soft:#F1DED1; --band:#4A2C20; --band-ink:#FCF5ED; --btn:#4A2C20; --btn-ink:#FCF5ED;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#2B1B15;--ink:#F6E9DD;--muted:#CBB09F;--rose:#B58E7C;--rose-soft:#3A261E;--band:#F1DED1;--band-ink:#3A261E;--btn:#F1DED1;--btn-ink:#3A261E}
}
:root[data-theme="dark"]{--bg:#2B1B15;--ink:#F6E9DD;--muted:#CBB09F;--rose:#B58E7C;--rose-soft:#3A261E;--band:#F1DED1;--band-ink:#3A261E;--btn:#F1DED1;--btn-ink:#3A261E}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:1.0625rem;line-height:1.65}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}

header{padding:1.25rem 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{font-family:var(--serif);font-size:1.7rem;font-weight:500;letter-spacing:.22em;text-decoration:none}
nav{display:flex;gap:1.5rem;font-size:.95rem}
nav a{text-decoration:none;padding:.25rem 0;border-bottom:1px solid transparent}
nav a:hover{border-color:var(--ink)}

.hero{padding:clamp(1.5rem,5vw,4rem) 0 clamp(3rem,8vw,6rem)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(2rem,6vw,5rem);align-items:center}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,6.4vw,4.9rem);line-height:1.04;margin:0 0 1.25rem;letter-spacing:-.01em}
.lead{font-size:1.15rem;max-width:34ch;color:var(--muted);margin:0 0 2rem}
.actions{display:flex;flex-wrap:wrap;gap:.9rem}
.btn{display:inline-block;padding:.85rem 1.6rem;border-radius:999px;text-decoration:none;font-weight:400;border:1px solid var(--btn);transition:transform .2s}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn:hover{transform:translateY(-2px)}
.logo-tile{background:#FCF5ED;border-radius:42% 42% 8% 8% / 30% 30% 4% 4%;padding:clamp(.5rem,2vw,1.25rem);max-width:460px;margin-inline:auto;width:100%}
.logo-tile img{display:block;width:100%;height:auto;border-radius:inherit}

section{padding:clamp(3rem,8vw,6rem) 0}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4.5vw,3.2rem);line-height:1.1;margin:0 0 .75rem}
.intro{max-width:46ch;color:var(--muted);margin:0 0 2.5rem}

.collection{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
.item{background:var(--rose-soft);border-radius:200px 200px 24px 24px;padding:2.5rem 2rem 2.25rem;text-align:center}
.item:nth-child(2){background:var(--rose);color:#3A2018;border-radius:24px 24px 200px 200px;padding:2.25rem 2rem 2.5rem}
.item svg{width:min(210px,60%);height:auto;margin:0 auto 1.25rem;display:block}
.item h3{font-family:var(--serif);font-weight:500;font-size:2rem;margin:0 0 .4rem}
.item p{margin:0 auto;max-width:34ch}
.note{margin:1.5rem 0 0;font-size:.95rem;color:var(--muted)}

.band{background:var(--band);color:var(--band-ink);text-align:center;padding:clamp(3.5rem,9vw,7rem) 0}
.band p{font-family:var(--serif);font-size:clamp(2rem,6vw,4.4rem);line-height:1.12;margin:0 auto;max-width:16ch;font-weight:400}

.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:start}
.contact p{margin:0 0 1.5rem;max-width:38ch;color:var(--muted)}

footer{padding:2rem 0 2.5rem;font-size:.92rem;color:var(--muted);border-top:1px solid var(--rose)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem}


.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem}
.product{display:flex;flex-direction:column;gap:.35rem}
.product img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px 20px 90px 20px;background:var(--rose-soft);display:block}
.product h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1.2;margin:.6rem 0 0}
.product .price{margin:0;color:var(--muted)}
.product button{align-self:flex-start;margin-top:.25rem;background:none;border:1px solid var(--rose);color:var(--muted);border-radius:999px;padding:.25rem .8rem;font:inherit;font-size:.85rem;cursor:pointer}
.admin{margin-top:3rem;background:var(--rose-soft);border-radius:24px;padding:1.25rem 1.5rem}
.admin summary{cursor:pointer;font-weight:400}
.admin form{display:grid;gap:1rem;margin-top:1.25rem;max-width:460px}
.admin label{display:grid;gap:.3rem;font-size:.95rem}
.admin input{font:inherit;padding:.65rem .8rem;border:1px solid var(--rose);border-radius:12px;background:var(--bg);color:var(--ink)}
.admin button{font:inherit;cursor:pointer;justify-self:start}
.admin button:disabled{opacity:.6;cursor:wait}
#status{margin:0;min-height:1.5em;font-size:.95rem}

.btn.sm{padding:.55rem 1.2rem;font-size:.95rem}
.product .btn{align-self:flex-start;margin-top:.4rem;border-radius:999px;font-size:.95rem;padding:.55rem 1.2rem}
.back{display:inline-block;margin-bottom:1.5rem;color:var(--muted)}
.checkout{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,4rem);align-items:start}
.checkout img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:24px 24px 120px 24px;background:var(--rose-soft);display:block}
.checkout h2{margin-bottom:.25rem}
.checkout .big{font-size:1.5rem;margin:0 0 1.5rem}
.checkout h3,.panel h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;margin:0 0 .75rem}
.checkout ol{padding-left:1.2rem;margin:0 0 1.5rem}
.checkout label,.panel label{display:grid;gap:.3rem;font-size:.95rem;margin-bottom:1rem}
.checkout input,.panel input{font:inherit;padding:.65rem .8rem;border:1px solid var(--rose);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.panel{background:var(--rose-soft);border-radius:24px;padding:1.25rem 1.5rem;margin-bottom:1.5rem;max-width:520px}
.panel form{display:grid;gap:.25rem}
.panel button{font:inherit;cursor:pointer;justify-self:start}
.panel button:disabled{opacity:.6;cursor:wait}
.row{display:flex;align-items:center;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--rose)}
.row img{width:56px;height:56px;object-fit:cover;border-radius:12px}
.row span{flex:1}
.row button{background:none;border:1px solid var(--rose);color:var(--muted);border-radius:999px;padding:.25rem .8rem;font:inherit;font-size:.85rem;cursor:pointer}
.steam path{stroke-dasharray:60;animation:steam 3.2s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.8s}
@keyframes steam{0%{stroke-dashoffset:60;opacity:0}30%{opacity:.9}100%{stroke-dashoffset:-60;opacity:0}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;stroke-dasharray:none}.btn{transition:none}html{scroll-behavior:auto}}

@media (max-width:820px){
  .hero .wrap,.contact .wrap,.collection,.checkout{grid-template-columns:1fr}
  .hero .logo-tile{order:-1;max-width:320px}
  nav{gap:1rem;font-size:.9rem}
  .brand{font-size:1.35rem}
}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="index.html">COFFELIA</a><nav><a href="index.html#catalogue">Voir le catalogue</a><a id="logout" href="#" hidden>Se déconnecter</a></nav></div></header>
<main><section style="padding-top:clamp(1.5rem,5vw,3rem)"><div class="wrap">
  <h2>Gestion du catalogue</h2>
  <p id="status" role="status" class="intro"></p>
  <div id="loginBox" class="panel" hidden>
    <h3>Connexion administrateur</h3>
    <form id="loginForm">
      <label>E-mail<input id="lEmail" type="email" autocomplete="username" required></label>
      <label>Mot de passe<input id="lPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
    </form>
  </div>
  <div id="adminPanel" hidden>
    <div class="panel"><h3>Ajouter un article</h3>
      <form id="addForm">
        <label>Nom<input id="fName" type="text" maxlength="60" required></label>
        <label>Prix (en DH)<input id="fPrice" type="number" min="0" step="any" inputmode="decimal" required></label>
        <label>Photo<input id="fPhoto" type="file" accept="image/*" required></label>
        <button class="btn primary" id="fBtn" type="submit">Ajouter au catalogue</button>
      </form></div>
    <div class="panel"><h3>Contact WhatsApp pour le paiement</h3>
      <form id="waForm">
        <label>Numéro WhatsApp (avec l’indicatif, ou 06… pour le Maroc)<input id="fWa" type="tel" inputmode="tel" autocomplete="off"></label>
        <button class="btn primary" type="submit">Enregistrer le numéro</button>
      </form></div>
    <h3 style="font-family:var(--serif);font-weight:500;font-size:1.5rem">Articles du catalogue</h3>
    <div id="adminList"></div>
  </div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg=window.COFFELIA_CONFIG,sb=supabase.createClient(cfg.url,cfg.anonKey);
  var $=function(id){return document.getElementById(id)},fmt=new Intl.NumberFormat("fr-FR");
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function say(m){$("status").textContent=m}
  function cleanWa(n){var s=String(n||"").replace(/\D/g,"");if(s.indexOf("00")===0)s=s.slice(2);else if(s.charAt(0)==="0")s="212"+s.slice(1);return s.length>=8?s:""}
  function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("image"))},"image/jpeg",.85)};img.onerror=function(){rej(new Error("image"))};img.src=u})}
  function showLogin(){$("loginBox").hidden=false;$("adminPanel").hidden=true;$("logout").hidden=true}
  async function check(){
    var s=(await sb.auth.getSession()).data.session;
    if(!s){showLogin();return}
    var r=await sb.rpc("is_admin");
    if(r.error||!r.data){await sb.auth.signOut();showLogin();say("Ce compte n’a pas accès à la gestion.");return}
    $("loginBox").hidden=true;$("adminPanel").hidden=false;$("logout").hidden=false;say("");await refresh();
  }
  async function refresh(){
    var p=await sb.from("products").select("*").order("created_at",{ascending:false});
    var w=await sb.from("settings").select("value").eq("key","whatsapp").maybeSingle();
    $("fWa").value=(w.data&&w.data.value)||"";
    var l=$("adminList");l.textContent="";
    var items=p.data||[];
    if(!items.length)l.append(el("p","note","Aucun article pour le moment."));
    items.forEach(function(it){
      var r=el("div","row"),img=el("img");img.src=it.image_url;img.alt="";
      var b=el("button",null,"Supprimer");b.type="button";
      b.addEventListener("click",async function(){
        if(b.dataset.ask!=="1"){b.dataset.ask="1";b.textContent="Confirmer";return}
        var d=await sb.from("products").delete().eq("id",it.id);
        if(d.error){say("La suppression a échoué.");return}
        await sb.storage.from("products").remove([it.image_url.split("/").pop()]);
        refresh();
      });
      r.append(img,el("span",null,it.name+" – "+fmt.format(it.price)+" DH"),b);l.append(r);
    });
  }
  $("loginForm").addEventListener("submit",async function(e){
    e.preventDefault();say("Connexion…");
    var r=await sb.auth.signInWithPassword({email:$("lEmail").value.trim(),password:$("lPass").value});
    if(r.error){say("E-mail ou mot de passe incorrect.");return}
    $("lPass").value="";check();
  });
  $("logout").addEventListener("click",async function(e){e.preventDefault();await sb.auth.signOut();say("");showLogin()});
  $("addForm").addEventListener("submit",async function(e){
    e.preventDefault();var btn=$("fBtn");btn.disabled=true;say("Ajout en cours…");
    try{
      var blob=await shrink($("fPhoto").files[0]),path=crypto.randomUUID()+".jpg";
      var u=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});
      if(u.error)throw u.error;
      var url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
      var i=await sb.from("products").insert({name:$("fName").value.trim(),price:Number($("fPrice").value),image_url:url});
      if(i.error)throw i.error;
      $("addForm").reset();say("Article ajouté.");await refresh();
    }catch(err){say("L’ajout a échoué. Vérifiez la photo et votre connexion.")}
    btn.disabled=false;
  });
  $("waForm").addEventListener("submit",async function(e){
    e.preventDefault();var raw=$("fWa").value.trim(),n=cleanWa(raw);
    if(raw&&!n){say("Numéro invalide. Vérifiez l’indicatif et les chiffres.");return}
    var r=await sb.from("settings").upsert({key:"whatsapp",value:n});
    say(r.error?"L’enregistrement a échoué.":"Numéro enregistré.");
  });
  check();
})();
</script>
</body>
</html>
